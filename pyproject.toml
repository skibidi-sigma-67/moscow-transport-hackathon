[project]
name = "moscow-transport-hackathon"
version = "0.1.0"
description = "ML-предиктор задержек городского транспорта на основе потоковой телеметрии NDTP. Решение для Хакатона Московского транспорта."
readme = "README.md"
authors = [
    { name = "Волычев Кирилл", email = "volychevk@gmail.com" },
    { name = "Геращенков Степан" },
    { name = "Пешкова Екатерина" },
    { name = "Расулова Марьям" },
    { name = "Смолянкин Тимофей" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/commons",
    "backend",
    "ml",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE002", "BLE001", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/backend/database/registry.py" = ["F401"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "commons"]
