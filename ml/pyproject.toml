[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8,<2",
    "numpy>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "commons",
    "pydantic-settings"
]

[tool.uv.sources]
commons = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "torch>=2.6,<3"
]
